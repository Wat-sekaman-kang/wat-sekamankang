<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ທຳນຽບສະມາຊິກພາຍໃນວັດ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ใช้ Font Awesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans Lao', 'sans-serif'], // ใช้ฟอนต์ພາສາລາວเพื่อความสวยงาม
                    },
                    colors: {
                        temple: {
                            dark: '#4A1C1C', // สีแดงเลือดหมูเข้ม (สีพื้นหลังหลัก)
                            gold: '#D4AF37', // สีทอง
                            lightgold: '#F3E5AB', // สีทองอ่อน
                            bg: '#FDFBF7', // สีพื้นหลังหน้าเว็บ (ขาวนวล)
                            robe: '#E67E22' // สีจีวร
                        }
                    }
                }
            }
        }
    </script>
        <link rel="stylesheet" href="css/members.css">
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-temple-dark text-temple-lightgold border-b border-temple-gold/50" aria-label="ເມນູຫຼັກ">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-center sm:justify-between items-center gap-3 text-sm font-semibold">
            <a href="index.html" class="hover:text-white transition-colors"><i class="fa-solid fa-arrow-left mr-2 text-temple-gold"></i>ກັບໜ້າຫຼັກ</a>
            <a href="gallery.html" class="hover:text-white transition-colors"><i class="fa-regular fa-images mr-2 text-temple-gold"></i>ຄັງຮູບພາບກິດຈະກຳ</a>
        </div>
    </nav>

    <header class="bg-temple-dark text-white py-12 relative overflow-hidden shadow-lg border-b-4 border-temple-gold">
        <!-- ลวดลายพื้นหลัง Header -->
        <div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 8px);"></div>
        
        <div class="container mx-auto px-4 relative z-10 text-center">
            <div class="inline-block p-4 rounded-full bg-temple-gold text-temple-dark mb-4 shadow-xl border-2 border-white transform transition-transform hover:scale-110 duration-500">
                <!-- ເພີ່ມຄລາສ animate-[spin_10s_linear_infinite] ໃຫ້ກົງລໍ້ໝຸນຊ້າໆ -->
                <i class="fa-solid fa-dharmachakra text-4xl animate-[spin_10s_linear_infinite]"></i>
            </div>
            <!-- ເພີ່ມຄລາສ text-shine ໃຫ້ຫົວຂໍ້ມີແສງສະທ້ອນ -->
            <h1 class="text-3xl md:text-5xl font-bold mb-2 text-shine drop-shadow-md">ທຳນຽບສະມາຊິກພາຍໃນວັດ</h1>
            <p class="text-lg md:text-xl text-temple-lightgold font-light max-w-2xl mx-auto mt-4">
                ລວບລວມປະຫວັດ ແລະ ທຳນຽບລາຍນາມ ພະພິກຂຸ ສາມະເນນ ແລະ ບຸກຄະລາກອນພາຍໃນວັດ ແບ່ງຕາມປີ (ພ.ສ.)
            </p>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- ส่วนเลือกปี (Tabs) -->
        <div class="mb-10 text-center">
            <h2 class="text-xl font-semibold mb-4 text-temple-dark flex items-center justify-center gap-2">
                <i class="fa-solid fa-calendar-alt text-temple-gold"></i>
                ເລືອກປີ (ພ.ສ.)
            </h2>
            <div id="year-tabs" class="flex flex-wrap justify-center gap-3">
                <!-- ปุ่มปีจะถูกสร้างที่นี่ด้วย JavaScript -->
            </div>
        </div>

        <!-- กล่องแสดงข้อความกำลังโหลด -->
        <div id="loading" class="text-center py-10 hidden">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-temple-gold mb-3"></i>
            <p class="text-gray-500">ກຳລັງໂຫຼດຂໍ້ມູນ...</p>
        </div>

        <!-- พื้นที่แสดงรายชื่อ (Grid) -->
        <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- การ์ดสมาชิกจะถูกสร้างที่นี่ด้วย JavaScript -->
        </div>

        <!-- กรณีไม่พบข้อมูล -->
        <div id="no-data" class="hidden text-center py-16 bg-white rounded-lg shadow-sm border border-gray-200 mt-6">
            <i class="fa-solid fa-folder-open text-5xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-medium text-gray-600">ບໍ່ພົບຂໍ້ມູນສະມາຊິກໃນປີທີ່ເລືອກ</h3>
        </div>

    </main>

    <footer class="bg-temple-dark text-temple-lightgold py-8 border-t-4 border-temple-gold mt-auto">
        <div class="container mx-auto px-4 text-center text-sm">
            <i class="fa-solid fa-leaf mb-3 text-temple-gold text-xl"></i>
            <p>© <span id="current-year-footer"></span> ຈັດທຳຂຶ້ນເພື່ອເປັນທຳນຽບປະຫວັດພາຍໃນວັດ</p>
            <p class="mt-1 opacity-70">ຂໍ້ມູນອາດມີການປ່ຽນແປງຕາມຄວາມເໝາະສົມ</p>
        </div>
    </footer>

        <script src="js/members.js" defer></script>
</body>
</html>
